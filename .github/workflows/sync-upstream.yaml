# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Sync Upstream

# Keeps this fork current with rustmailer/bichon, feature by feature. main
# here also carries the SSO/OIDC support from rustmailer/bichon#328 (merged
# locally, not upstream), so this merge can genuinely conflict if upstream
# ever touches the same auth/login files -- unlike a plain mirror.
#
# Every run (clean or conflicting) always lands as a pull request rather than
# a direct push to main, because the run also reapplies this fork's README
# branding (scripts/rebrand-readme.py) on top of whatever upstream shipped,
# and that's worth a quick look before it merges.

on:
  schedule:
    - cron: '17 3 */14 * *'
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    name: Merge rustmailer/bichon
    if: github.repository == 'birdrock00/havanese-bichon-sso'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Configure git identity
        run: |-
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: |-
          git remote add upstream https://github.com/rustmailer/bichon.git
          git fetch upstream main

      - name: Attempt merge
        id: merge
        run: |-
          if git merge --no-edit upstream/main; then
            echo "conflict=false" >> "$GITHUB_OUTPUT"
          else
            git merge --abort
            echo "conflict=true" >> "$GITHUB_OUTPUT"
            # Merge with conflict markers left in place so the PR shows
            # reviewers exactly what needs manual resolution.
            git merge --no-edit --no-ff -X ours upstream/main || true
          fi

      - name: Reapply README branding
        run: python3 scripts/rebrand-readme.py

      - name: Commit branding pass
        run: |-
          git add README.md
          git diff --cached --quiet || git commit -m "chore: reapply fork README branding"

      - name: Push sync branch
        id: push
        run: |-
          branch="sync-upstream/$(date -u +%Y%m%d)"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          git push origin "HEAD:$branch" --force

      - name: Open pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |-
          existing="$(gh pr list --head "${{ steps.push.outputs.branch }}" --state open --json number --jq '.[0].number')"
          if [ -n "$existing" ]; then
            echo "PR #$existing already open for ${{ steps.push.outputs.branch }}, skipping"
            exit 0
          fi
          if [ "${{ steps.merge.outputs.conflict }}" = "true" ]; then
            title="Sync upstream: merge conflict needs manual resolution"
            body="Automated sync from rustmailer/bichon main hit a conflict, most likely against the SSO/OIDC changes from #328 that live only in this fork. Conflict markers are left in place on \`${{ steps.push.outputs.branch }}\` -- resolve them and merge manually."
          else
            title="Sync upstream: $(date -u +%Y-%m-%d)"
            body="Clean automated merge of rustmailer/bichon main, plus a README rebrand pass. Safe to merge once checks pass."
          fi
          gh pr create --title "$title" --body "$body" --head "${{ steps.push.outputs.branch }}" --base main
